site_name: LeetCode 演算法精鍊筆記
site_description: LeetCode 解題筆記與演算法整理 (C++)
repo_url: https://github.com/smartcsie/leetcode
repo_name: smartcsie/leetcode

theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - tables
  - attr_list