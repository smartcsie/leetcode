  note: '> 外迴圈i為column(string的第幾個char) 0 ~ cols，內迴圈j為row(第幾個string) 1 ~ rows<br>

    > 發現前面string第i個char比後面string第i個char大，bitset那個位置，往下一個char檢查，if(strs[j-1][i] > strs[j][i])
    { bits.set(i);  break;}

    > **return static_cast<int>(bits.count())** <br>'
