  note: '> [Find the Pivot Integer](https://leetcode.com/problems/pivot-integer/)<br>

    > Pivot integer為 summation開根號<br>

    > int sum = n * (n + 1) / 2;<br>

    > int x = static_cast<int>(sqrt(sum));<br>

    > if(x * x == sum) return x;<br>

    > return -1;<br>'
