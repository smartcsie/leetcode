  note: '> [Count the Number of Special Characters I](https://leetcode.com/problems/count-the-number-of-special-characters-i/)<br>

    > 要記錄char大小寫都有出現的字元數

    > **for(char c : word) {** <br>

    > &emsp;&emsp;&emsp;&emsp;**if(islower(c)) lower |= 1 << (c-''a'');** <br>

    > &emsp;&emsp;&emsp;&emsp;**if(isupper(c)) upper |= 1 << (c-''A'');** <br>

    > **}** <br>

    > **return __builtin_popcount(lower & upper);** <br>'
