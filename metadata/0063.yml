  note: '> [Unique Paths II](https://leetcode.com/problems/unique-paths-ii)<br>

    > 先取得size，int m = obstacleGrid.size(); int n = obstacleGrid[0].size();<br>

    > 起一個vector紀錄，vector<long> dp(n); dp[0] = 1;<br>

    > for(int i = 0; i < m;i++) {<br>

    > &emsp;&emsp;&emsp;&emsp;**for(int j = 0; j < n;j++) {** <br>

    > &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**if(obstacleGrid[i][j]) dp[j]
    = 0;** <br>

    > &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**else if(j > 0) dp[j] += dp[j
    - 1];** <br>

    > &emsp;&emsp;&emsp;&emsp;**}** <br>

    > }<br>'
