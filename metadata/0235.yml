  note: '> **if(root->val > p->val && root->val >  q->val)**<br>

    > **確定p q 在左側，return lowestCommonAncestor(root->left, p, q);**<br>

    > **if(root->val < p->val && root->val < q->val)*<br>

    > **確定p q 在右側，return lowestCommonAncestor(root->right, p, q);**<br>

    > **確定p q 在一左一右，return root;**<br>

    > **也可以用236解法，但236是O(N)，本解法是O(h)，還是比較好**<br>'
