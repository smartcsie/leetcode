  note: '> [Remove All Occurrences of a Substring](https://leetcode.com/problems/remove-all-occurrences-of-a-substring/)<br>

    > 先算part的size，int k = part.size();<br>

    > 把souce string s 每個ch 慢慢加到 res<br>

    > 每次加到res，如果res長度大於等於k，則比對尾巴字串，if (res.size() >= k && res.compare(res.size() -
    k, k, part) == 0) <br>

    > res.resize，比string erase效率高<br>'
