  note: '> [Lexicographically Smallest String After a Swap](https://leetcode.com/problems/lexicographically-smallest-string-after-a-swap/)<br>

    > 前後兩個character找到相同parity且前面character比較大，做swap<br>

    > **for(int i = 1; i < s.size(); i++) {** <br>

    > &emsp;&emsp;&emsp;&emsp;**if((s[i-1] & 1) == (s[i] & 1) && s[i-1] > s[i]) {**
    <br>

    > &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**swap(s[i], s[i-1]);** <br>

    > &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**break;** <br>

    > &emsp;&emsp;&emsp;&emsp;**}** <br>

    > **}** <br>'
