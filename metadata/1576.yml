number: 1576
title: Replace All ?'s
url: https://leetcode.com/problems/replace-all-s-to-avoid-consecutive-repeating-characters/
solutions:
- file: Solution_1576.cpp
  difficulty: 🟢 Easy
  tags:
  - Greedy
  topics:
  - greedy-string-construction
  time: O(N)
  space: O(1)
  familiarity: 再練習
  note: '> 將字串中的 ''?'' 替換為合法字元，保證相鄰字元不重複遍歷字串，當遇到 ''?'' 時，從 ''a'', ''b'', ''c'' 中選出一個與左右相鄰皆不同的字元替換<br>

    > **for(char c = ''a''; c <= ''c''; c++) {** <br>

    > &emsp;&emsp;&emsp;&emsp;**if(i > 0 && s[i - 1] == c) continue;** <br>

    > &emsp;&emsp;&emsp;&emsp;**if(i < s.size() && s[i + 1] == c) continue;** <br>

    > &emsp;&emsp;&emsp;&emsp;**s[i] = c;** <br>

    > **}** <br>'
