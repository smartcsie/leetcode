  note: '> [Check if Numbers Are Ascending in a Sentence](https://leetcode.com/problems/check-if-numbers-are-ascending-in-a-sentence)<br>

    > 用一個 istringstream iss(s)<br>

    > **while(iss >> word) {** <br>

    > &emsp;&emsp;&emsp;&emsp;**if(isdigit(word[0])) {** <br>

    > &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**int num = stoi(word);** <br>

    > &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**if(num <= prev) return false;**
    <br>

    > &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**prev = num;** <br>

    > &emsp;&emsp;&emsp;&emsp;**}** <br>

    > **}** <br>'
