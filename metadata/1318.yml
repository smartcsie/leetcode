  mastered_date: '2026-11-12'
  note: '> **int diff = (a | b) ^ c，diff主要顯示哪些bit需要翻轉** <br>

    > **__builtin_popcount(diff)，計算至少需要翻轉的次數** <br>

    > **__builtin_popcount(a & b & diff);因為a,b bit=1，需要多翻轉一次** <br>


    > **a=0010，b=0110，c=0101**<br>

    > **diff = (a | b) ^ c  = 0011**<br>

    > **__builtin_popcount(diff) = 2**<br>

    > **LSB + 和倒數第2位元至少需要翻轉一次**<br>

    > **__builtin_popcount(a & b & diff) = 1**<br>

    > **diff = (a | b) ^ c  = 0010**<br>

    > **倒數第2位元需要多翻轉一次**<br>'
  official_solution: synced
