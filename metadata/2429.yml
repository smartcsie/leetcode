  note: '> 要找一個和num2 set bit數目相等，且和num1 XOR 最小的數<br>

    > 先計算bits數目，int bits = __builtin_popcount(num2);<br>

    > 起一個 int ans，把num1 有1的先set到ans，bits一邊減<br>

    > 把剩下的bits由低到高set到ans，前題是ans的那一個bit為 0<br>'
