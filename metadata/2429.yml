  note: '> **先計算ans的bit數目，要跟num2一樣，int bits =__builtin_popcount(num2);**

    > **ans和num1 XOR要有最小的值，就是先消耗num1大的1**

    > **if(num1 & (1 << i)) { ans |= 1 << i; bits--;}**

    > **還有多的bits，由右往左，如果ans該bit為0，則補1**

    > **if(num1 & (1 << i)) { ans |= 1 << i; bits--;}**

    > **if(!((ans >> i) & 1)) { ans |= 1 << i; bits--;}**'
