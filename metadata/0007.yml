  note: '> [Overflow handle] <br>

    > x 本身是合法的 int，所以它反轉前的最高位最多是 2（因為 INT_MAX 開頭是 2）<br>

    > 也就是說 digit 最大只會是 2，永遠不可能 > 7，<br>

    > 所以那個條件實際上永遠不會觸發，可以安全移除。<br>

    > 只需要檢查 res > INT_MAX / 10 或 res < INT_MIN / 10 就夠了。<br>'
