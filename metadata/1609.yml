    reason: "class Solution {\npublic:\n    bool isEvenOddTree(TreeNode* root) {\n\
      \        queue<TreeNode*> q({root});\n        bool odd = true;\n        while(!q.empty())\
      \ {\n            int prev = 0;\n            for(int i = q.size() - 1; i >= 0;\
      \ i--) {\n                TreeNode* node = q.front(); q.pop();\n           \
      \     if(odd ^ (node->val & 1)) return false;\n                if(prev > 0 &&\
      \ (odd ^ (prev < node->val))) return false;\n                prev = node->val;\n\
      \                if(node->left) q.push(node->left);\n                if(node->right)\
      \ q.push(node->right);\n            }\n            odd = !odd;\n        }\n\
      \        return true;\n    }\n};"
