  note: '> [Angle Between Hands of a Clock](https://leetcode.com/problems/angle-between-hands-of-a-clock/)  <br>

    > **double hourAngle =  12 * 30.0 + minutes * 0.5;**  // 時針角度：hour * 30 + 分鐘帶來的偏移
    (每分鐘 0.5 度)<br>

    > **double minAngle = minutes * 6.0;**  // 分針角度：每分鐘 6 度<br>

    > **double angle = std::abs(hourAngle - minAngle);**  // 計算兩者差值<br>

    > **return std::min(360.0 - angle, angle);**  // 返回較小的夾角<br>'
