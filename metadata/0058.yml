  note: '> [Length of Last Word](https://leetcode.com/problems/length-of-last-word)
    <br>

    > 頭尾都有可能有空白<br>

    > 先把right調過尾巴的空白，指到最後一個word的最後一個char，while (right >= 0 && s[right] == '' '') {right--;}<br>

    > 開始算最後一組word長度，while (right >= 0 && s[right] != '' '') { right--; length++;}<br>

    > [複習] right >= 0'
