      \ q) {\n        if(!p && !q) return true;\n        return  (p && q)\n      \
      \          && isSymmetric(p->left, q->right) \n                && isSymmetric(p->right,\
      \ q->left);\n    }\npublic:\n    bool isSymmetric(TreeNode* root) {\n      \
      \  return isSymmetric(root, root);\n    }\n};"
