  note: '> [Check if One String Swap Can Make Strings Equal](https://leetcode.com/problems/check-if-one-string-swap-can-make-strings-equal/)<br>

    > 找出限定一個character swap，兩字串能否相等<br>

    > 如果兩字串長度不一樣，return false<br>

    > 直接比較兩字串相同index之character，放入vector<pair<char, char>> diff;<br>

    > 比較期間，如果diff大小超過2，表示無法緊用一次swap，return false<br>

    > 最後產生兩種結果，一種是兩字串已經相等，一種是((diff.size() == 2) && (diff[0].first == diff[1].second)
    && (diff[0].second == diff[1].first));<br>'
  familiarity: 生疏
