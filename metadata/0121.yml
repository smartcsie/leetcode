solutions:
- file: Solution_0121.cpp
  difficulty: 🟢 Easy
  tags:
  - Dp State Machine
  - Dynamic Programming State Machine
  topics:
  - dp-state-machine
  time: O(N)
  space: O(1)
  familiarity: 練習過
  note: '> **口袋只有 0 元，買一次賣一次就結束。**<br>

    > **buy = max(buy, -price);profit = max(profit, price);**<br>

    > **return buy + profit，不能這樣是因為要有先買後賣的順序**<br>

    > **buy keep 買進最小值，abs(buy)最小**<br>

    > **profit keep 先買後賣利潤最大**<br>'
  tricks: null
