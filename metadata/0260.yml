  note: '> [Single Number III](https://leetcode.com/problems/single-number-iii) <br>

    > 兩數出現1次，其他出現兩次，xor_ab等於所有數XOR的結果<br>

    > 算diff_bit，為a和b比較大的數的MSB，int diff_bit = 1;  while((xor_ab & diff_bit) == 0)  diff_bit
    <<= 1;<br>

    > 再travsal nums，如果num和diff_bit AND > 0，num XOR 到a，否則b<br>'
