  note: '> **prev指向不重覆的最後一個node**<br>

    > **cur如果遇到重覆，會先travsal到重覆的最後一個node**<br>

    > **prev->next如果等於cur，表示目前cur是unique，pre往後走一步，pre = cur**<br>

    > **prev->next如果不等於cur，表示目前cur是重覆，pre要跳過，pre->next = cur->next<br>'
