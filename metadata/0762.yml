  note: '> [Prime Number of Set Bits](https://leetcode.com/problems/prime-number-of-set-bits-in-binary-representation/)<br>

    > 對於範圍在 [1, 1e6] 的數字，其二進位長度最多不超過 20 位（因為 2^20 > 1e6) <br>

    > isPrime只要判斷 if(n == 2 || n == 3 || n == 5 || n == 7 || n == 11 || n == 13 ||
    n == 17 || n == 19) <br>

    > [left , right]範圍內 int bits = __builtin_popcount(i); if(isPrime(bits)) count++;<br>'
