  note: '> [Power of Two](https://leetcode.com/problems/power-of-two/)<br>

    > **(n > 0) && (n & (n-1)) == 0** <br>


    > 解法二 迴圈解法<br>

    > **if(n <= 0) return false;** <br>

    > **while(n % 2 == 0) n /= 2;** <br>

    > **return n == 1;** <br>


    > 解法三 bit數量<br>

    > **return n >= 0 && __builtin_popcount(n) == 1;** <br>'
