  note: '> **邏輯如下**<br>

    > **int x = min({a, b, c});**<br>

    > **int z = max({a, b, c});**<br>

    > **int y = (a + b + c) - (x + z);**<br>

    > **return z > (x + y) ? x + y : (x + y + z) / 2;**<br>'
