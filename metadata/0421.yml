    reason: "/**\n * 題目：421. Maximum XOR of Two Numbers in an Array\n * 難度：Medium\n\
      \ * 描述：給定非負整數陣列 nums，回傳 nums[i] XOR nums[j] 的最大值（0 <= i <= j < n）。\n *\n * 分類主題：trie\n\
      \ * 技巧：二進位 Trie, 由高位到低位貪心選相反位元, 邊插入邊查詢, 以最大值的位元長度決定層數\n *\n * 時間複雜度：O(N · L)，L\
      \ 為最大值的二進位位數，最多 31\n * 空間複雜度：O(N · L)，Trie 最多 N · L 個節點\n *\n * 解法思路：二進位 Trie\
      \ + 貪心\n * 1. XOR 的結果要最大，就要讓高位元盡量是 1。\n *    對固定的 num，從最高位開始，每一位都優先走「和 num 該位元相反」的路，\n\
      \ *    走得通就讓結果的該位元為 1，走不通才退而求其次走相同位元。\n * 2. 把每個數字的二進位（固定 L 位，由高到低）當作一條路徑存進\
      \ Trie，\n *    每個節點只有兩個子節點，代表 0 與 1。\n *    L 取最大值的二進位位數，所有數字補齊到同樣長度，路徑才能對齊。\n\
      \ * 3. 對每個 num 同時做兩件事（用兩個指標走）：\n *    - node：把 num 插入 Trie。\n *    - xorNode：在\
      \ Trie 中貪心尋找能和 num 配出最大 XOR 的路徑。\n * 4. 邊插入邊查詢不會漏掉任何配對：\n *    兩個數 a、b 中較晚處理的那個，查詢時另一個已經在\
      \ Trie 裡了。\n *    num 也可能和自己配對，XOR 為 0，不影響答案（答案至少是 0）。\n * 5. 查詢時 xorNode 不會走到空節點：\n\
      \ *    xorNode 一定停在某條已存在的完整路徑上（包含剛插入的 num 自己），\n *    若相反位元的子節點不存在，則相同位元的子節點必然存在。\n\
      \ * 6. 特例：最大值為 0 代表全部是 0，答案是 0，直接回傳。\n */\nstruct TrieNode {\n    TrieNode*\
      \ children[2] = {nullptr, nullptr};  // children[0]、children[1] 對應位元 0、1\n};\n\
      \nclass Solution {\npublic:\n    int findMaximumXOR(std::vector<int>& nums)\
      \ {\n        int maxNum = *std::max_element(nums.begin(), nums.end());\n   \
      \     if (maxNum == 0) return 0;  // 全部是 0，任何 XOR 都是 0\n\n        // 計算二進位長度\
      \ L (等價 Java 的 Integer.toBinaryString(maxNum).length())\n        // std::bit_width\
      \ 需要 C++20 與 <bit>\n        int L = std::bit_width(static_cast<unsigned int>(maxNum));\n\
      \        int maxXor = 0;\n\n        TrieNode* root = new TrieNode();\n\n   \
      \     for (int num : nums) {\n            TrieNode* node = root;     // 插入用的指標\n\
      \            TrieNode* xorNode = root;  // 查詢用的指標\n            int currXor =\
      \ 0;           // num 與 Trie 中某數配出的最大 XOR\n\n            for (int i = L - 1;\
      \ i >= 0; i--) {\n                int bit = (num >> i) & 1;  // num 的第 i 位\n\
      \                int toggledBit = bit ^ 1;  // 相反位元，走這條路 XOR 該位為 1\n\n     \
      \           // 1. 建立 / 插入當前數字到 Trie\n                if (node->children[bit]\
      \ == nullptr) {\n                    node->children[bit] = new TrieNode();\n\
      \                }\n                node = node->children[bit];\n\n        \
      \        // 2. 貪婪尋找能夠產生最大 XOR (相反位元) 的路徑\n                if (xorNode->children[toggledBit]\
      \ != nullptr) {\n                    currXor |= (1 << i);                  \
      \  // 這一位能湊出 1\n                    xorNode = xorNode->children[toggledBit];\n\
      \                } else {\n                    xorNode = xorNode->children[bit];\
      \       // 只能走相同位元，這一位是 0\n                }\n            }\n\n            maxXor\
      \ = std::max(maxXor, currXor);\n        }\n\n        return maxXor;\n    }\n\
      };"
