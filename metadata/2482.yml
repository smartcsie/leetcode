  note: '> 要輸出結果矩陣，ans[i][j]為ith row 1的數量 - 0的數量加上 jth col 1的數量 - 0的數量<br>

    > 第一個雙層loop計算每一row和每一col的值<br>

    >  ** for(int i = 0 ; i < m; i++) {**  <br>

    >  &emsp;&emsp;&emsp;&emsp;** for(int j = 0 ; j < n; j++) {**  <br>

    >  &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;** int val = grid[i][j] ? 1
    : -1;**  <br>

    >  &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;** rowSum[i] += val;**  <br>

    >  &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;** colSum[j] += val;**  <br>

    >  &emsp;&emsp;&emsp;&emsp;**}** <br>

    >  **}

    > 第二個雙層loop計算輸出矩陣ans<br>

    >  **for(int i = 0; i < m; i++) {** <br>

    >  &emsp;&emsp;&emsp;&emsp;**for(int j = 0; j < n; j++) {** <br>

    >  &emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;**ans[i][j] += rowSum[i] +
    colSum[j];** <br>

    >  &emsp;&emsp;&emsp;&emsp;**}** <br>

    >  **}

    <br><br>'
