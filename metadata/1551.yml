  note: '> **n分別減去前面n/2個之和**<br>

    > **n是odd，(n^2-1)/4**<br>

    > **n是odd，n^2/4**<br>

    > **假設n=6，數列為1 3 5 7 9 11，結果為5 + 3 + 1 = 9**<br>

    > **推導 (n-1)+(n-3)+(n-5) = (2n-n)*(n/2)/2 = n^2/4**<br>

    > **假設n=5，數列為1 3 5 7 9，結果為4 + 2 = 6**<br>

    > **推導 (n-1)+(n-3) = [((n - 1) + 2) * (n - 1)/2] /2**<br>'
