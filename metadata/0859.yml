  note: '> ** 此題一定要交換至少一次**  <br>

    > ** s 和 goal 長度不一樣，傳回false**<br>

    > ** 兩字串相等，s = "aa"，goal = "aa" 可以，aa交換** <br>

    > ** 字串相等有重覆char，合法** <br>

    > ** 兩字串相等，s = "ab"，goal = "ab" 不可以，ab無法交換** <br>

    > ** 兩字串不相等，檢查交換一次相異char，就可以相等**  <br>'
