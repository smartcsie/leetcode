  note: '> [String to Integer (atoi)](https://leetcode.com/problems/string-to-integer-atoi)<br>

    > 處裡多餘空白，while(i < n && s[i] == '' '') i++;<br>

    > 處裡正負號，int sign = 1;  if(s[i] == ''+'' || s[i] == ''-'' ) sign = (s[i++] == ''+'')
    ? 1 : -1;<br>

    > while(i < n && isdigit(s[i])) {<br>

    > int digit = s[i++] - ''0'';<br>

    > if(res > (INT_MAX - digit) / 10) return sign == 1 ? INT_MAX : INT_MIN;<br>

    > res = res * 10 + digit;<br>

    } <br>'
  familiarity: 生疏
