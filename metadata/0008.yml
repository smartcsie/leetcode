solutions:
- file: Solution_0008.cpp
  difficulty: 🟡 Medium
  tags:
  - Math Digit Decomposition
  - Math
  topics:
  - math-digit-decomposition
  time: O(N)
  space: O(1)
  familiarity: 練習過
  note: '> **[overflow handle]累加數字超過 INT_MAX**<br>

    > **處裡多餘空白，while(i < n && s[i] == '' '') i++;**<br>

    > **處裡正負號，int sign = 1;  if(s[i] == ''+'' || s[i] == ''-'' )**<br>

    > **sign = (s[i] == ''+'') ? 1 : -1;**<br>

    > **if(res > (INT_MAX - digit) / 10) **<br>

    > **return sign == 1 ? INT_MAX : INT_MIN;**<br>

    > **res = res * 10 + digit;**<br>'
  tricks:
  - overflow handle
