  note: '> [Combination Sum](https://leetcode.com/problems/combination-sum/)<br>

    > 先對candidates做排序，sort(candidates.begin(), candidates.end());<br>

    > 副程式combinationSum，多int start call by value，vector<vector<int>> res; vector<int>
    cur; call by reference<br>

    > for(int i = start; i < candidates.size(); i++)內要判斷 if(candidates[i] > target)
    break;否則跑不出來<br>

    > 因為此題允許元素重覆使用，遞迴呼叫**i不用+1**，combinationSum(candidates, target , **i**, cur, res);<br>'
  familiarity: 生疏
