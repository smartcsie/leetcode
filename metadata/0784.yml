  note: '> [Letter Case Permutation](https://leetcode.com/problems/letter-case-permutation/)
    <br>

    > index從開始傳進backtrack，因為只要處理大小寫，index先跳過不是大小寫，while (index < s.size() && isdigit(s[index]))
    index++<br>

    > 終止遞迴條件， if(index == s.size()) { res.push_back(s); return;}<br>

    > index目標字元轉lowercase遞迴， s[index] = tolower(s[index]); backtrack(s, index + 1,
    res);<br>

    > index目標字元轉uppercase遞迴， s[index] = toupper(s[index]); backtrack(s, index + 1,
    res);<br>






    <br><br>'
  familiarity: 生疏
