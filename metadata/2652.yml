    > travsal 1~n，如果是3或5或7能整除，則加到sum，最後回傳sum <br>

    > for(int i = 1 ;i <= n; i++) { <br>

    > if(i % 3 == 0 || i % 5 == 0 || i % 7 == 0) sum += i; <br>

    > }<br>'
